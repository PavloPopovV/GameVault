name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gamevault
          POSTGRES_PASSWORD: gamevault
          POSTGRES_DB: gamevault_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gamevault" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://gamevault:gamevault@localhost:5432/gamevault_test
      TEST_DATABASE_URL: postgresql://gamevault:gamevault@localhost:5432/gamevault_test
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run test:integration

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('client/package-lock.json') != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        if: hashFiles('client/package-lock.json') != ''
      - run: npm run lint
        if: hashFiles('client/package-lock.json') != ''
      - run: npm run build
        if: hashFiles('client/package-lock.json') != ''
