# Render Blueprint: бекенд GameVault (Node.js + Express)
# База даних — Neon (PostgreSQL), рядок підключення вводиться вручну при створенні Blueprint.
services:
  - type: web
    name: gamevault-api
    runtime: node
    plan: free
    region: frankfurt
    branch: develop
    rootDir: server
    buildCommand: npm ci && npm run db:migrate && npm run db:seed:if-empty
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: CLIENT_URL
        sync: false
      - key: RAWG_API_KEY
        sync: false
