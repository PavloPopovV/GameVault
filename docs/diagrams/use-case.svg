pacingAndGlyphs" textLength="90" x="498.5" y="339.8857">в бібліотеці]</text><!--link UC6 to UC4--><path d="M357.5,363.2969 C357.5,342.1169 357.5,308.4769 357.5,284.3669 " fill="none" id="UC6-UC4" style="stroke: #3B4A6B; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#3B4A6B" points="357.5,279.0769,353.5,288.0769,357.5,284.0769,361.5,288.0769,357.5,279.0769" style="stroke: #3B4A6B; stroke-width: 1.0;"/><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="66" x="296.5" y="310.042">«extend»</text><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="88" x="285.5" y="326.3389">[користувач</text><text fill="#000000" font-family="DejaVu Sans" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="117" x="271" y="342.6357">авторизований]</text><!--
@startuml
left to right direction
skinparam defaultFontName "DejaVu Sans"
skinparam defaultFontSize 14
skinparam shadowing false
skinparam actorStyle awesome
skinparam usecase {
  BackgroundColor #F4F6FA
  BorderColor #3B4A6B
  ArrowColor #3B4A6B
}
skinparam rectangle {
  BorderColor #3B4A6B
  FontSize 16
}
skinparam actor {
  BorderColor #3B4A6B
  BackgroundColor #FFFFFF
}
skinparam ArrowColor #3B4A6B

title GameVault — діаграма прецедентів (Use Case)

actor "Гість" as Guest
actor "Користувач" as User
actor "Адміністратор" as Admin

User -up-|> Guest
Admin -up-|> User

rectangle "GameVault" {
  usecase "Зареєструватися" as UC1
  usecase "Авторизуватися" as UC2
  usecase "Переглядати каталог\nі шукати ігри" as UC3
  usecase "Переглянути сторінку гри" as UC4
  usecase "Керувати бібліотекою\n(статуси проходження)" as UC5
  usecase "Додати гру у Wishlist" as UC6
  usecase "Написати рецензію\nз оцінкою 1-10" as UC7
  usecase "Переглянути профіль\nі статистику" as UC8
  usecase "Керувати каталогом ігор" as UC9
